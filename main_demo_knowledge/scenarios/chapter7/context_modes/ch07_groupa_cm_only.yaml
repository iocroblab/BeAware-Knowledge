# Ch07 Context Mode Query-Reduction Scaling: Group A's Context Mode alone
# (cm_dangerous_object_handling), so the Group-A-alone cm-gated scenario
# does not also pay for evaluating the other groups' Context Triggers. See
# ../README.md.

individuals:

  - name: cm_dangerous_object_handling
    individual_classes: ["ContextMode"]
    property_dictionary:
      description: "Acceptable Risk: active whenever the manipulated object is a DangerousObject. SPARQL Trigger activation mechanism."
      isContextModeOf: b_pick
      hasContextTrigger: "ASK WHERE { <object> rdf:type/rdfs:subClassOf* onto:DangerousObject }"
