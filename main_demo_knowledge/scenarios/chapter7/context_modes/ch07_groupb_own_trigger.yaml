# Ch07 Context Mode Query-Reduction Scaling: Group B (low battery, ontology-
# state/SWRL) alone, own-Trigger arm. See ../README.md.

individuals:

  - name: tiago
    individual_classes: ["Robot"]
    clear_properties:
      - hasBattery
    property_dictionary:
      hasBattery: 40.0

  - name: flavor_qr2_b1_low_battery_reserve
    individual_classes: ["FixParameter"]
    property_dictionary:
      description: "Ch07 Context-Mode grouping experiment, own-Trigger arm, Group B (ontology-state/SWRL/low battery) 1/2, alone: raise the minimum battery reserve threshold kept during Pick."
      isFlavorOf: b_pick
      hasParamTarget: battery_reserve_threshold
      hasNewValue: "15.0"
      hasTrigger: "ASK WHERE { <robot> onto:hasBattery ?lvl . FILTER(?lvl < 65) }"

  - name: flavor_qr2_b2_low_battery_slow_pick
    individual_classes: ["ModulateParameter"]
    property_dictionary:
      description: "Ch07 Context-Mode grouping experiment, own-Trigger arm, Group B (ontology-state/SWRL/low battery) 2/2, alone: reduce Pick's velocity by 20% to conserve energy when the acting robot's battery is low."
      isFlavorOf: b_pick
      hasParamTarget: velocity
      hasPercentageModifier: -20
      hasTrigger: "ASK WHERE { <robot> onto:hasBattery ?lvl . FILTER(?lvl < 65) }"
