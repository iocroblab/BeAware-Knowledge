# Ch05 Knowledge Base Loading and Scaling: Extra Large ontology-size variant,
# layered on top of main_demo_large_expanded_ontology.yaml. Property values
# (weights/colors/volumes) repeat across objects; only individual count
# matters for this scaling comparison. See ../README.md.

individuals:

  # --- New world structure: an extra storage_room Location with two Surfaces -----

  - name: storage_room
    individual_classes: ["Location"]
    property_dictionary:
      locationInRoom: kitchen

  - name: storage_room_left
    individual_classes: ["Surface"]
    property_dictionary:
      surfaceInLocation: storage_room

  - name: storage_room_right
    individual_classes: ["Surface"]
    property_dictionary:
      surfaceInLocation: storage_room

